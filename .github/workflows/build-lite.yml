name: Build Harmonia Lite (portable EXE)

on:
  push:
    branches: [feature/lite-suite-editions]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '.github/workflows/build-lite.yml'
      - 'scripts/**'
  pull_request:
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - '.github/workflows/build-lite.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lite:
    runs-on: windows-latest
    steps:
      - name: Check out Harmonia
        uses: actions/checkout@v4

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish portable, self-contained Lite EXE
        shell: pwsh
        run: |
          dotnet publish Harmonia.csproj -c Release -r win-x64 --self-contained true -o Lite-Output -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -p:IncludeNativeLibrariesForSelfExtract=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path 'Lite-Output/Harmonia.exe')) { throw 'Lite executable missing' }
          if (Get-ChildItem Lite-Output -Include '*.sys','*.inf','*.cat' -Recurse) { throw 'Driver files in Lite output' }

      - name: Add quick-start instructions
        shell: pwsh
        run: |
          @'
          HARMONIA LITE - PORTABLE PREVIEW

          Double-click Harmonia.exe on Windows 10/11 x64.
          No Git, PowerShell, developer tools or separate .NET runtime needed.
          No driver or administrator setup required.

          Audio still uses WASAPI loopback of the Windows default playback device.
          Assign DIFFERENT physical output endpoints; a selected output must not
          also be the captured default endpoint. Real native 5.1 virtual capture
          is not part of this Lite preview. Multi-device clock drift is possible.
          The program can continue running in the Windows notification area.
          To exit completely, right-click its tray icon and choose Exit.

          This is an experimental build, not a signed release.
          Windows SmartScreen may warn about an unsigned app.
          Do not disable security protections; use only if you trust the source.
          '@ | Set-Content 'Lite-Output/README-FIRST.txt'

      - name: Archive Lite
        shell: pwsh
        run: Compress-Archive -Path 'Lite-Output/*' -DestinationPath 'Harmonia-Lite-win-x64.zip'

      - name: Upload downloadable preview
        uses: actions/upload-artifact@v4
        with:
          name: Harmonia-Lite-win-x64
          path: Harmonia-Lite-win-x64.zip
          if-no-files-found: error
          retention-days: 30

  publish-preview:
    name: Publish Lite preview to Releases
    needs: lite
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/lite-suite-editions'
    runs-on: ubuntu-latest
    steps:
      - name: Download tested Lite ZIP
        uses: actions/download-artifact@v4
        with:
          name: Harmonia-Lite-win-x64
          path: release

      - name: Verify release file
        run: test -s release/Harmonia-Lite-win-x64.zip

      - name: Publish prerelease (one-time version)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view v0.1.0-lite-preview >/dev/null 2>&1; then
            echo "Preview release already exists; not overwriting an existing build."
            exit 0
          fi
          gh release create v0.1.0-lite-preview release/Harmonia-Lite-win-x64.zip \
            --target "$GITHUB_SHA" \
            --title "Harmonia Lite v0.1.0 — Preview" \
            --notes "Portable, driverless Windows x64 preview. Download Harmonia-Lite-win-x64.zip, extract and run Harmonia.exe. No PowerShell, Git, Visual Studio, or separate .NET installation needed. Uses the experimental WASAPI loopback backend; no virtual playback driver, no native 5.1 input guarantee, and independent output clocks can drift. This is an unsigned early preview, not a production-ready release. Harmonia Suite remains in kernel-driver development and is not included." \
            --prerelease
